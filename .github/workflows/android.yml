name: Android release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_ARCHIVE: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.0-stable.tar.xz
  FLUTTER_SHA256: 26cd99d3d94b1367e6b50535a18aeef0282c10a535bbe3ec493534dcdab75296
  RUSTUP_INIT: https://static.rust-lang.org/rustup/archive/1.29.0/x86_64-unknown-linux-gnu/rustup-init
  RUSTUP_INIT_SHA256: 4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10
  RUST_TOOLCHAIN: 1.97.1
  RUSTFLAGS: -C link-dead-code
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install verified Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 "$RUSTUP_INIT" -o "$RUNNER_TEMP/rustup-init"
          echo "$RUSTUP_INIT_SHA256  $RUNNER_TEMP/rustup-init" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/rustup-init"
          export CARGO_HOME="$RUNNER_TEMP/cargo" RUSTUP_HOME="$RUNNER_TEMP/rustup"
          "$RUNNER_TEMP/rustup-init" -y --no-modify-path --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
          "$CARGO_HOME/bin/rustup" target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          host="$($CARGO_HOME/bin/rustc -vV | sed -n 's/^host: //p')"
          ln -s "$RUST_TOOLCHAIN-$host" "$RUSTUP_HOME/toolchains/stable-$host"
          echo "CARGO_HOME=$CARGO_HOME" >>"$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >>"$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >>"$GITHUB_PATH"

      - name: Install verified Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 "$FLUTTER_ARCHIVE" -o "$RUNNER_TEMP/flutter.tar.xz"
          echo "$FLUTTER_SHA256  $RUNNER_TEMP/flutter.tar.xz" | sha256sum --check --strict
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/flutter.tar.xz"
          git config --global --add safe.directory "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >>"$GITHUB_PATH"

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --concurrency=1

      - name: Build split Android APKs and app bundle
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.DELTIECORD_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DELTIECORD_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DELTIECORD_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DELTIECORD_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/deltiecord-release.jks"
          trap 'rm -f -- "$keystore"' EXIT
          missing=()
          [[ -n "$KEYSTORE_BASE64" ]] || missing+=(DELTIECORD_ANDROID_KEYSTORE_BASE64)
          [[ -n "$STORE_PASSWORD" ]] || missing+=(DELTIECORD_ANDROID_STORE_PASSWORD)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(DELTIECORD_ANDROID_KEY_PASSWORD)
          if ((${#missing[@]})); then
            printf 'Missing Android signing secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode >"$keystore"
          [[ -s "$keystore" ]] || exit 1
          chmod 0600 "$keystore"
          effective_store_password="$STORE_PASSWORD"
          effective_key_password="$KEY_PASSWORD"
          if ! keytool_output="$(keytool -J-Duser.language=en -list -v -keystore "$keystore" -storepass "$effective_store_password" 2>&1)"; then
            keytool_output="$(keytool -J-Duser.language=en -list -v -keystore "$keystore" -storepass "$KEY_PASSWORD" 2>&1)"
            effective_store_password="$KEY_PASSWORD"
            effective_key_password="$STORE_PASSWORD"
          fi
          if [[ -z "$KEY_ALIAS" ]]; then
            KEY_ALIAS="$(sed -n 's/^Alias name: //p' <<<"$keytool_output" | head -n 1)"
          fi
          [[ -n "$KEY_ALIAS" ]] || exit 1
          export DELTIECORD_ANDROID_KEYSTORE="$keystore"
          export DELTIECORD_ANDROID_STORE_PASSWORD="$effective_store_password"
          export DELTIECORD_ANDROID_KEY_ALIAS="$KEY_ALIAS"
          export DELTIECORD_ANDROID_KEY_PASSWORD="$effective_key_password"
          flutter build apk --release --split-per-abi
          flutter build appbundle --release

      - name: Package Android releases
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(sed -n 's/^version: \([^[:space:]]*\).*/\1/p' pubspec.yaml)"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/deltiecord-${release_id}-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/deltiecord-${release_id}-android-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/deltiecord-${release_id}-android-x86_64.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/deltiecord-${release_id}-android.aab"
          (cd dist && sha256sum -- * >SHA256SUMS-android)

      - name: Upload Android artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deltiecord-android
          path: dist/*
          if-no-files-found: error
          retention-days: 30
