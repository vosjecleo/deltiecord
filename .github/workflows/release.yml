name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate release tag and await matching package runs
        id: release
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          build_number="$(sed -n 's/^version: [^+]*+\(.*\)/\1/p' pubspec.yaml)"
          expected_tag="v${package_version}-b${build_number}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Expected tag $expected_tag for pubspec version, got $GITHUB_REF_NAME" >&2
            exit 1
          fi

          await_run() {
            local workflow="$1"
            local runs successful failed
            for _ in $(seq 1 225); do
              runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$GITHUB_SHA" --limit 5 --json databaseId,status,conclusion)"
              successful="$(jq -r '.[] | select(.status == "completed" and .conclusion == "success") | .databaseId' <<<"$runs" | head -n 1)"
              if [[ -n "$successful" ]]; then
                printf '%s\n' "$successful"
                return 0
              fi
              failed="$(jq -r '.[] | select(.status == "completed" and .conclusion != "success") | .databaseId' <<<"$runs" | head -n 1)"
              if [[ -n "$failed" ]]; then
                echo "$workflow failed for tagged commit $GITHUB_SHA (run $failed)." >&2
                return 1
              fi
              echo "Waiting for $workflow on $GITHUB_SHA..." >&2
              sleep 20
            done
            echo "Timed out waiting for $workflow on $GITHUB_SHA." >&2
            return 1
          }

          windows_run="$(await_run 'Windows release')"
          linux_run="$(await_run 'Linux packages')"
          android_run="$(await_run 'Android release')"

          echo "version=$package_version" >>"$GITHUB_OUTPUT"
          echo "build=$build_number" >>"$GITHUB_OUTPUT"
          echo "windows_run=$windows_run" >>"$GITHUB_OUTPUT"
          echo "linux_run=$linux_run" >>"$GITHUB_OUTPUT"
          echo "android_run=$android_run" >>"$GITHUB_OUTPUT"

      - name: Download successful platform packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-staging/windows release-staging/linux release-staging/android
          gh run download "${{ steps.release.outputs.windows_run }}" --repo "$GITHUB_REPOSITORY" --dir release-staging/windows
          gh run download "${{ steps.release.outputs.linux_run }}" --repo "$GITHUB_REPOSITORY" --dir release-staging/linux
          gh run download "${{ steps.release.outputs.android_run }}" --repo "$GITHUB_REPOSITORY" --dir release-staging/android

      - name: Assemble and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          build="${{ steps.release.outputs.build }}"
          release_id="${version}+${build}"
          mkdir -p release-assets

          copy_unique() {
            local filename="$1"
            mapfile -t matches < <(find release-staging -type f -name "$filename" -print)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              printf 'Expected exactly one %s, found %s\n' "$filename" "${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            fi
            cp -- "${matches[0]}" "release-assets/$filename"
          }

          copy_unique "deltiecord-${release_id}-windows-x64-portable.zip"
          copy_unique "deltiecord-${release_id}-windows-x64-setup.exe"
          copy_unique "deltiecord-${release_id}-linux-appimage-x86_64.AppImage"
          copy_unique "deltiecord-${release_id}-linux-arch-x86_64.pkg.tar.zst"
          copy_unique "deltiecord-${release_id}-linux-debian-amd64.deb"
          copy_unique "deltiecord-${release_id}-android-arm64-v8a.apk"
          copy_unique "deltiecord-${release_id}-android-armeabi-v7a.apk"
          copy_unique "deltiecord-${release_id}-android-x86_64.apk"
          copy_unique "deltiecord-${release_id}-android.aab"

          (cd release-assets && sha256sum -- * >SHA256SUMS)
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 10

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          build="${{ steps.release.outputs.build }}"
          cat >release-notes.md <<EOF
          Deltiecord ${version} build ${build} is a desktop and Android beta for Matrix.

          Please read the [installation guide](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/INSTALL.md) before installing, and check the [known issues](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/KNOWN_ISSUES.md) before reporting a bug.

          Packages are provided for Android, Windows x86-64, Debian/Ubuntu/Mint amd64, Arch Linux x86-64, and other current x86-64 Linux distributions through AppImage. Verify downloads with the attached SHA256SUMS file.

          This is beta software. Windows in particular still benefits from testing across more hardware and Windows 10/11 installations.

          The project is licensed under AGPL-3.0-or-later. Bundled third-party notices are included in the binary packages and source tree.
          EOF

          # Tag recreation during prerelease correction must not strand stale
          # platform assets under the final tag. Keep publication idempotent so
          # the newest successful tagged commit replaces the earlier draft.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Deltiecord ${version} build ${build} (Beta)" \
            --notes-file release-notes.md \
            --prerelease \
            --latest=false \
            --verify-tag
