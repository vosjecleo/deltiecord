name: Linux packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_ARCHIVE: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.0-stable.tar.xz
  FLUTTER_SHA256: 26cd99d3d94b1367e6b50535a18aeef0282c10a535bbe3ec493534dcdab75296
  RUSTUP_INIT: https://static.rust-lang.org/rustup/archive/1.29.0/x86_64-unknown-linux-gnu/rustup-init
  RUSTUP_INIT_SHA256: 4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10
  RUST_TOOLCHAIN: 1.97.1
  # Keep flutter_vodozemac's Dart DL shim in AOT release builds.
  RUSTFLAGS: -C link-dead-code

jobs:
  debian:
    runs-on: ubuntu-24.04
    container: debian:12
    timeout-minutes: 75
    steps:
      - name: Install Debian build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl xz-utils git clang cmake make ninja-build pkg-config fakeroot binutils file patchelf libgtk-3-dev libsecret-1-dev libpulse-dev libasound2-dev libv4l-dev libmpv-dev libpipewire-0.3-dev appstream dbus-x11 xvfb xauth
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install verified Rust toolchain
        run: |
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 "$RUSTUP_INIT" -o /tmp/rustup-init
          echo "$RUSTUP_INIT_SHA256  /tmp/rustup-init" | sha256sum --check --strict
          chmod 0755 /tmp/rustup-init
          export CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup
          /tmp/rustup-init -y --no-modify-path --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
          host="$(/opt/cargo/bin/rustc -vV | sed -n 's/^host: //p')"
          ln -s "$RUST_TOOLCHAIN-$host" "$RUSTUP_HOME/toolchains/stable-$host"
          echo CARGO_HOME=/opt/cargo >> "$GITHUB_ENV"
          echo RUSTUP_HOME=/opt/rustup >> "$GITHUB_ENV"
          echo /opt/cargo/bin >> "$GITHUB_PATH"
      - name: Install verified Flutter SDK
        run: |
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 "$FLUTTER_ARCHIVE" -o /tmp/flutter.tar.xz
          echo "$FLUTTER_SHA256  /tmp/flutter.tar.xz" | sha256sum --check --strict
          tar -C /opt -xf /tmp/flutter.tar.xz
          git config --global --add safe.directory /opt/flutter
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo /opt/flutter/bin >> "$GITHUB_PATH"
      - name: Validate and build Debian/AppImage releases
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test --concurrency=1
          flutter build linux --release
          packaging/linux/verify-release.sh
          packaging/linux/build-deb.sh
          packaging/linux/build-appimage.sh
          version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          cp packaging/README.md dist/README.txt
          printf 'Deltiecord %s\nGit commit: %s\n' "$version" "$GITHUB_SHA" >dist/BUILD-INFO.txt
          (cd dist && sha256sum -- *.deb *.AppImage >SHA256SUMS)
      - name: Test Debian installation, launch, and removal
        run: |
          install -d -m 0700 "$HOME/.local/share/deltiecord"
          touch "$HOME/.local/share/deltiecord/ci-user-data-marker"
          apt-get install -y ./dist/*.deb
          test -x /usr/lib/deltiecord/deltiecord
          set +e
          timeout 15s dbus-run-session -- xvfb-run -a /usr/bin/deltiecord >debian-smoke.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            cat debian-smoke.log
            message="$(tail -n 20 debian-smoke.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/$/%0A/g')"
            printf '::error title=Debian smoke launch failed::status=%s %s\n' "$status" "$message"
            printf 'Deltiecord exited unexpectedly with status %s\n' "$status" >&2
            exit 1
          fi
          apt-get remove -y deltiecord
          test -f "$HOME/.local/share/deltiecord/ci-user-data-marker"
      - name: Upload Debian and AppImage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Deltiecord-linux-debian12-x86_64
          path: dist/*
          if-no-files-found: error

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 75
    steps:
      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm --needed ca-certificates curl xz git clang cmake ninja pkgconf gtk3 libsecret libpulse alsa-lib libv4l mpv pipewire rustup xdg-desktop-portal xorg-server-xvfb dbus
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create unprivileged package user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Install verified Flutter SDK
        run: |
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 "$FLUTTER_ARCHIVE" -o /tmp/flutter.tar.xz
          echo "$FLUTTER_SHA256  /tmp/flutter.tar.xz" | sha256sum --check --strict
          tar -C /opt -xf /tmp/flutter.tar.xz
          chown -R builder:builder /opt/flutter
      - name: Install pinned Rust toolchain
        run: |
          runuser -u builder -- env HOME=/home/builder bash -lc "rustup toolchain install '$RUST_TOOLCHAIN' --profile minimal"
          host="$(runuser -u builder -- env HOME=/home/builder rustup run "$RUST_TOOLCHAIN" rustc -vV | sed -n 's/^host: //p')"
          runuser -u builder -- ln -s "$RUST_TOOLCHAIN-$host" "/home/builder/.rustup/toolchains/stable-$host"
      - name: Build native Arch package
        run: |
          runuser -u builder -- env PATH="/opt/flutter/bin:$PATH" HOME=/home/builder bash -lc "cd '$GITHUB_WORKSPACE' && git config --global --add safe.directory /opt/flutter && git config --global --add safe.directory '$GITHUB_WORKSPACE' && flutter pub get && dart format --output=none --set-exit-if-changed . && flutter analyze && flutter test --concurrency=1 && packaging/arch/build-package.sh"
          cd dist
          sha256sum -- *.pkg.tar.zst >SHA256SUMS
      - name: Test Arch installation, launch, and removal
        run: |
          install -d -m 0700 "$HOME/.local/share/deltiecord"
          touch "$HOME/.local/share/deltiecord/ci-user-data-marker"
          pacman -U --noconfirm dist/*.pkg.tar.zst
          test -x /usr/lib/deltiecord/deltiecord
          set +e
          timeout 15s dbus-run-session -- xvfb-run -a /usr/bin/deltiecord >arch-smoke.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            cat arch-smoke.log
            printf 'Deltiecord exited unexpectedly with status %s\n' "$status" >&2
            exit 1
          fi
          pacman -R --noconfirm deltiecord
          test -f "$HOME/.local/share/deltiecord/ci-user-data-marker"
      - name: Upload Arch artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Deltiecord-linux-arch-x86_64
          path: dist/*
          if-no-files-found: error
